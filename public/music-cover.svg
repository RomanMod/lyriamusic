  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
